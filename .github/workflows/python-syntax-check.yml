name: Python syntax check

on:
  push:
    paths:
      - "projects/eeg-signal-analysis/**/*.py"
      - ".github/workflows/python-syntax-check.yml"
  pull_request:
    paths:
      - "projects/eeg-signal-analysis/**/*.py"
      - ".github/workflows/python-syntax-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source
        run: python -m compileall -q projects/eeg-signal-analysis/eeg_neurorobotics_project.py
